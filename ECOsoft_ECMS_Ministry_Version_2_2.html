<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECOsoft ECMS — Ministry Prototype</title>
<style>
:root{--navy:#142b49;--navy2:#203e63;--gold:#c6a45b;--bg:#f3f6fa;--ink:#1d2939;--muted:#718096;--line:#e4eaf1;--green:#16845b;--blue:#2868b2;--red:#b94b4b;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:#dce6f1;padding:20px 13px;flex-shrink:0;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:5px 9px 21px;border-bottom:1px solid #ffffff24}.mark{width:39px;height:39px;border-radius:11px;background:var(--gold);color:#172c49;display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{color:white;font-size:17px;letter-spacing:.4px}.brand small{display:block;color:#afc0d4;font-size:9px;letter-spacing:1.3px}.navlabel{font-size:10px;color:#8fa7c0;letter-spacing:1.3px;text-transform:uppercase;margin:21px 10px 7px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin:2px 0;border:0;border-radius:8px;background:none;color:#cbd8e7;text-align:left;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff19;color:#fff}.ico{width:19px;text-align:center}.sidefoot{margin-top:auto;padding:15px 9px 2px;border-top:1px solid #ffffff24;color:#a9bbd0;font-size:10px}.main{flex:1;min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 27px;position:sticky;top:0;z-index:3}.top strong{font-size:14px}.topright{display:flex;align-items:center;gap:12px}.selectrole{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:white;font-size:11px;color:#31445b;max-width:260px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8edf4;color:var(--navy);display:grid;place-items:center;font-weight:800}.content{max-width:1500px;margin:auto;padding:26px 28px 45px}.heading{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.heading h1{font-size:23px;color:#172d49;margin:0 0 5px}.heading p{margin:0;color:var(--muted);font-size:12px}.btn{border:0;border-radius:7px;padding:9px 13px;background:var(--navy);color:#fff;font-weight:650;font-size:11px;cursor:pointer}.btn:hover{filter:brightness(1.1)}.btn.gold{background:var(--gold);color:#172b46}.btn.light{background:#edf2f7;color:#31445b}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.sm{padding:6px 9px;font-size:10px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 5px 18px #1b35510b}.stat{padding:16px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.statnum{font-size:27px;font-weight:800;color:#1c3555;margin:8px 0 2px}.statnote{font-size:10px;color:#8b98a8}.staticon{width:32px;height:32px;border-radius:8px;background:#edf3f9;display:grid;place-items:center;color:var(--blue);font-size:16px}.panel{margin-bottom:16px;overflow:hidden}.ph{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.ph h3{font-size:13px;color:#1d3554;margin:0}.pb{padding:16px 17px}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}th{text-align:left;background:#f8fafc;color:#718096;padding:10px 12px;white-space:nowrap}td{padding:11px 12px;border-top:1px solid #edf0f4;vertical-align:middle}tr:hover td{background:#fbfcfe}.status{display:inline-block;border-radius:20px;padding:4px 8px;font-size:9px;font-weight:750;background:#edf2f7;color:#52657a;white-space:nowrap}.pending{background:#fff3d8;color:#946512}.approved{background:#e4f5ec;color:#18754e}.progress{background:#e8f1ff;color:#285d9d}.returned{background:#fdeaea;color:#a43c3c}.archived{background:#e9f3ee;color:#27734f}.draft{background:#f0edfa;color:#6951a3}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.search{border:1px solid #dce3eb;border-radius:7px;padding:8px 10px;min-width:210px;font:inherit;font-size:11px}.field{margin-bottom:13px}.field label{display:block;font-size:10px;font-weight:750;color:#53657a;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3eb;border-radius:7px;padding:9px 10px;font:inherit;font-size:11px;background:white}.field textarea{min-height:76px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.full{grid-column:1/-1}.note{font-size:10px;color:#718096;background:#f7f9fc;border:1px solid var(--line);padding:10px;border-radius:7px}.task{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f4;align-items:flex-start}.task:last-child{border:0}.fileico{width:32px;height:36px;border-radius:7px;background:#edf3fa;color:#3d6eaa;display:grid;place-items:center;flex-shrink:0}.task b{font-size:11px}.task small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.task .right{margin-left:auto;text-align:right;white-space:nowrap}.timeline{border-left:2px solid #dce6f0;margin:10px 0 5px 7px;padding-left:17px}.event{position:relative;margin:0 0 14px}.event:before{content:'';position:absolute;left:-23px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--gold)}.event b{font-size:10px}.event small{display:block;color:var(--muted);font-size:9px}.folderlayout{display:grid;grid-template-columns:235px 1fr;min-height:400px}.folders{border-right:1px solid var(--line);padding:13px}.folder{padding:8px 9px;border-radius:7px;cursor:pointer;color:#52657a;font-size:11px}.folder:hover,.folder.selected{background:#edf3f9;color:#1d426e;font-weight:700}.folder.child{padding-left:25px}.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.doccard{border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}.doccard:hover{border-color:#9bb4d0;background:#fbfdff}.doccard .di{font-size:22px;color:#4c79ac}.doccard b{display:block;font-size:10px;margin-top:7px;overflow-wrap:anywhere}.doccard small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.meta{background:#f8fafc;border-radius:8px;padding:11px;font-size:10px}.meta div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #e9eef3}.meta div:last-child{border:0}.modalback{position:fixed;inset:0;background:#0e203b88;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{background:#fff;border-radius:12px;width:min(700px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 70px #0a1b3380}.mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mh h3{margin:0;font-size:14px}.mb{padding:18px}.close{border:0;background:#edf1f5;border-radius:6px;padding:5px 9px;cursor:pointer}.actions{display:flex;gap:7px;justify-content:flex-end;margin-top:15px}.toast{position:fixed;bottom:20px;right:22px;background:#173a5e;color:#fff;padding:11px 15px;border-radius:8px;z-index:20;display:none;font-size:11px}.toast.show{display:block}.hierarchy{display:grid;grid-template-columns:1fr;gap:5px;max-width:650px;margin:auto}.level{padding:9px;border-radius:7px;text-align:center;background:#edf2f7;font-weight:700;font-size:11px}.level.ps{background:#dceafe;color:#1d4777}.level.dept{background:#eaf1f7}.arrow{text-align:center;color:#9aa9b8;font-size:14px}.mini{font-size:9px;color:var(--muted)}.refchip{display:inline-flex;gap:5px;align-items:center;background:#edf3f9;color:#31577e;border-radius:5px;padding:4px 7px;font-size:9px;margin:2px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);padding:0 15px}.tabs button{border:0;background:none;padding:10px 9px;font-size:10px;color:#65768a;cursor:pointer}.tabs button.active{color:#1d4777;border-bottom:2px solid var(--gold);font-weight:750}
@media(max-width:950px){.side{width:64px;padding:14px 7px}.brand{padding:0 4px 17px}.brand>div:last-child,.navlabel,.nav button span:last-child,.sidefoot{display:none}.nav button{justify-content:center;padding:12px 4px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:19px 14px}.top{padding:0 14px}.folderlayout{grid-template-columns:160px 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark">E</div><div><b>ECOsoft ECMS</b><small>MINISTRY EDITION</small></div></div><div class="navlabel">Workspace</div><nav class="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span><span>Dashboard</span></button><button data-page="inbox"><span class="ico">▤</span><span>My Tasks / Inbox</span></button><button data-page="team"><span class="ico">♧</span><span>Department Tasks</span></button><button data-page="start"><span class="ico">＋</span><span>Start Process</span></button><button data-page="repository"><span class="ico">▣</span><span>Repository / Archive</span></button><button data-page="search"><span class="ico">⌕</span><span>Search & Tracking</span></button><div class="navlabel">Management</div><button data-page="reports"><span class="ico">▥</span><span>Reports & Audit</span></button><button data-page="admin"><span class="ico">⚙</span><span>Administration</span></button></nav><div class="sidefoot">Ministry of Public Administration<br>Prototype environment · v2.1</div></aside><main class="main"><header class="top"><strong id="crumb">Ministry Workspace / Dashboard</strong><div class="topright"><select class="selectrole" id="role" title="Switch demonstration user"><option value="Desk Officer">Desk Officer · Initiator</option><option value="Chief Officer">Chief Officer</option><option value="Assistant Director">Assistant Director</option><option value="Deputy Director">Deputy Director</option><option value="Director">Director · Department</option><option value="Permanent Secretary">Permanent Secretary</option><option value="Minister of State">Minister of State</option><option value="Honourable Minister">Honourable Minister</option></select><div class="avatar" id="avatar">DO</div></div></header><section class="content" id="view"></section></main></div><div class="modalback" id="modalback"><div class="modal"><div class="mh"><h3 id="modtitle">Details</h3><button class="close" onclick="closeModal()">✕</button></div><div class="mb" id="modbody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let page='dashboard',role='Desk Officer',folder='Office of the Permanent Secretary',selectedDoc=null;
const docs=[{id:'DOC-2026-0018',name:'Request for Procurement of ICT Equipment.pdf',folder:'ICT Department',type:'PDF',date:'14 Nov 2026',owner:'ICT Department',class:'Official',status:'Archived'},{id:'DOC-2026-0017',name:'Quarterly Performance Report Q3.pdf',folder:'Planning, Research & Statistics',type:'PDF',date:'12 Nov 2026',owner:'PRS Department',class:'Official',status:'Archived'},{id:'DOC-2026-0016',name:'Staff Training Nominal Roll.xlsx',folder:'Human Resources',type:'XLSX',date:'10 Nov 2026',owner:'Human Resources',class:'Official',status:'Archived'},{id:'DOC-2026-0015',name:'Circular on Financial Regulations.pdf',folder:'Office of the Permanent Secretary',type:'PDF',date:'08 Nov 2026',owner:'Office of PS',class:'Confidential',status:'Archived'},{id:'DOC-2026-0014',name:'Approved Establishment Request.docx',folder:'Finance & Accounts',type:'DOCX',date:'06 Nov 2026',owner:'Finance & Accounts',class:'Official',status:'Archived'}];
let processes=[{id:'ECO-2026-0041',title:'Request for Procurement of ICT Equipment',dept:'ICT Department',initiator:'A. Bello · Desk Officer',stage:'Awaiting Director',status:'In Progress',owner:'Director',actions:[['14 Nov 2026 · 09:10','A. Bello · Desk Officer','Initiated process and attached requisition.'],['14 Nov 2026 · 09:42','Assistant Director, ICT','Reviewed request and forwarded to Director.']]},{id:'ECO-2026-0040',title:'Request for Official Duty Tour',dept:'Human Resources',initiator:'M. Okafor · Desk Officer',stage:'With Permanent Secretary',status:'With Permanent Secretary',owner:'Permanent Secretary',actions:[['13 Nov 2026 · 10:05','M. Okafor · Desk Officer','Submitted duty tour request.'],['13 Nov 2026 · 12:30','Director, HR','Recommended approval and forwarded to PS.']]},{id:'ECO-2026-0039',title:'Submission of Quarterly Performance Report',dept:'Planning, Research & Statistics',initiator:'T. James · Desk Officer',stage:'Implementation',status:'Implementation',owner:'Director',actions:[['11 Nov 2026 · 09:00','T. James · Desk Officer','Submitted quarterly report.'],['11 Nov 2026 · 11:30','Director, PRS','Recommended approval.'],['12 Nov 2026 · 14:20','Permanent Secretary','Approved submission and directed implementation.']]},{id:'ECO-2026-0038',title:'Request for Staff Training',dept:'Human Resources',initiator:'S. Musa · Desk Officer',stage:'Archived',status:'Archived',owner:'Registry',actions:[['05 Nov 2026 · 08:40','S. Musa · Desk Officer','Initiated training request.'],['05 Nov 2026 · 11:10','Director, HR','Recommended approval.'],['06 Nov 2026 · 09:15','Permanent Secretary','Approved request.'],['07 Nov 2026 · 15:20','Training Unit','Completed implementation and closed file.'],['07 Nov 2026 · 15:21','ECOsoft System','Automatically archived complete process and action history.']]}];
const departments=['Administration','Finance & Accounts','Human Resources','ICT Department','Planning, Research & Statistics','Procurement','Legal Services','Internal Audit','Press & Public Relations'];
const processOptions=['General Correspondence / Official Memorandum','Request for Approval','Request for Funds','Request for Procurement','Official Duty Tour','Staff Training / Capacity Development','Leave / Human Resource Matter','Submission of Report','Request for ICT Support','Inter-Departmental Memo','Contract / Project Approval','Other Administrative Matter'];
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#role').onchange=e=>{role=e.target.value;$('#avatar').textContent=role.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();render();toast('Demonstration role changed to '+role)};
function heading(title,sub,button=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}function stat(label,note,num,ico){return `<div class="stat"><div class="stathead"><span>${label}</span><span class="staticon">${ico}</span></div><div class="statnum">${num}</div><div class="statnote">${note}</div></div>`}function status(s){let c=s==='Archived'?'archived':s.includes('Approved')?'approved':s==='Implementation'?'progress':s==='Returned'?'returned':s==='Draft'?'draft':'pending';return `<span class="status ${c}">${s}</span>`}function processTable(arr=processes){return `<div class="tablewrap"><table><thead><tr><th>Tracking ID</th><th>Process / Subject</th><th>Originating Department</th><th>Current Stage</th><th>Status</th><th></th></tr></thead><tbody>${arr.map(p=>`<tr><td><b>${p.id}</b></td><td>${p.title}<div class="mini">Initiated by ${p.initiator}</div></td><td>${p.dept}</td><td>${p.stage}</td><td>${status(p.status)}</td><td><button class="btn light sm" onclick="openProcess('${p.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function render(){let v=$('#view');$('#crumb').textContent='Ministry Workspace / '+({dashboard:'Dashboard',inbox:'My Tasks',team:'Department Tasks',start:'Start Process',repository:'Repository / Archive',search:'Search & Tracking',reports:'Reports & Audit',admin:'Administration'}[page]);if(page==='dashboard'){v.innerHTML=heading('Ministry Dashboard','A consolidated view of correspondence, approvals, departmental work and archived records.')+`<div class="cards">${stat('Open tasks','Awaiting your attention','08','▤')}${stat('Department tasks','Across your department','14','♧')}${stat('Files with senior management','At PS / Ministerial offices','05','◷')}${stat('Archived records','Completed and preserved','1,284','▣')}</div><div class="grid2"><div class="panel"><div class="ph"><h3>Recent workflow activity</h3><button class="btn light sm" onclick="setPage('inbox')">View inbox</button></div>${processTable(processes.slice(0,3))}</div><div class="panel"><div class="ph"><h3>My work queue</h3><span class="tag">${role}</span></div><div class="pb"><div class="task"><div class="fileico">▧</div><div><b>Review ICT equipment procurement request</b><small>ECO-2026-0041 · ICT Department</small></div><div class="right">${status('Pending')}</div></div><div class="task"><div class="fileico">▧</div><div><b>Duty tour approval</b><small>ECO-2026-0040 · Human Resources</small></div><div class="right">${status('Pending')}</div></div><div class="task"><div class="fileico">▧</div><div><b>Quarterly report implementation</b><small>ECO-2026-0039 · PRS Department</small></div><div class="right">${status('Implementation')}</div></div><div class="note">Switch the demonstration role in the top-right menu to experience the workflow at different levels of the Ministry.</div></div></div></div><div class="panel"><div class="ph"><h3>Quick actions</h3></div><div class="pb"><div class="toolbar"><button class="btn" onclick="setPage('start')">＋ Initiate a process</button><button class="btn light" onclick="setPage('repository')">▣ Open repository</button><button class="btn light" onclick="setPage('search')">⌕ Track a file</button></div></div></div>`}
if(page==='inbox'||page==='team'){v.innerHTML=heading(page==='inbox'?'My Tasks':'Department Tasks',page==='inbox'?'Tasks assigned directly to you, saved drafts and completed actions.':'Tasks awaiting action within your department, including unassigned and completed tasks.')+`<div class="panel"><div class="tabs"><button class="active" onclick="tabFilter('all',this)">Open / Assigned</button><button onclick="tabFilter('pending',this)">Awaiting action</button><button onclick="tabFilter('progress',this)">Implementation</button><button onclick="tabFilter('archived',this)">Completed</button></div><div class="pb" id="tasklist">${processTable(processes.filter(p=>p.status!=='Archived'))}</div></div><div class="note">Tasks can be opened to read the original submission, inspect the complete action history, add official minutes, forward, recommend, approve, return for information or reassign (subject to role permissions).</div>`}
if(page==='start'){v.innerHTML=heading('Start a New Process','Initiate correspondence from the desk officer or any authorised officer. Select a process type from the dropdown.')+`<div class="panel"><div class="ph"><h3>Process initiation form</h3><span class="tag">Bottom-to-top workflow</span></div><div class="pb"><div class="formgrid"><div class="field full"><label>AVAILABLE PROCESS *</label><select id="ptype"><option value="">— Select a process —</option>${processOptions.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>SUBJECT / TITLE *</label><input id="ptitle" placeholder="Enter the subject of the submission"></div><div class="field"><label>ORIGINATING DEPARTMENT *</label><select id="pdept">${departments.map(x=>`<option ${x==='ICT Department'?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>INITIATING OFFICER *</label><input id="pinit" value="A. Bello · Desk Officer"></div><div class="field"><label>SEND TO / FORWARD TO *</label><select id="pfirst"><option>Chief Officer</option><option selected>Assistant Director</option><option>Deputy Director</option><option>Director</option></select><div class="mini">Choose a senior officer within your department. The system will enforce the Ministry reporting hierarchy.</div></div><div class="field"><label>PRIORITY</label><select id="priority"><option>Normal</option><option>Urgent</option><option>Very Urgent</option></select></div><div class="field"><label>REFERENCE / FILE NUMBER</label><input id="pref" placeholder="Optional existing file reference"></div><div class="field"><label>CLASSIFICATION</label><select id="pclass"><option>Official</option><option>Confidential</option><option>Secret</option></select></div><div class="field full"><label>SUMMARY / PURPOSE OF SUBMISSION *</label><textarea id="psummary" placeholder="Briefly describe the matter. Attach the substantive memo or document below."></textarea></div><div class="field full"><label>ATTACH DOCUMENT</label><input type="file" id="pfile"><div class="mini">Prototype note: file selection is demonstrated locally; production requires secure central file storage.</div></div><div class="field full"><label>LINK EXISTING REPOSITORY DOCUMENT (OPTIONAL)</label><select id="plink"><option value="">— No linked document —</option>${docs.map(d=>`<option value="${d.id}">${d.id} · ${d.name}</option>`).join('')}</select></div></div><div class="note">On submission, the system generates a unique tracking ID and routes the file to the appropriate superior officer in the originating department. The Director reviews the departmental minutes and recommends onward action. Only the Director may forward a departmental submission to the Permanent Secretary. The Permanent Secretary may forward it to the Minister, Minister of State or back down the Ministry hierarchy as appropriate.</div><div class="actions"><button class="btn light" onclick="toast('Draft saved in this demonstration')">Save as Draft</button><button class="btn" onclick="submitProcess()">Submit Process →</button></div></div></div>`}
if(page==='repository'){v.innerHTML=heading('Repository / Records Archive','A structured electronic file cabinet. Each completed process is preserved with its documents, metadata and full action history.')+`<div class="panel"><div class="ph"><h3>Ministry repository</h3><div class="toolbar"><input class="search" id="docsearch" placeholder="Search documents or reference..." oninput="filterDocs()"><button class="btn light sm" onclick="toast('Upload panel is available in the production design')">↑ Upload</button><button class="btn light sm" onclick="toast('New folder created in prototype view')">＋ New folder</button></div></div><div class="folderlayout"><div class="folders"><b class="mini">FOLDER TRAY</b><div class="folder selected" onclick="chooseFolder('Office of the Permanent Secretary',this)">▾ Ministry Repository</div><div class="folder child" onclick="chooseFolder('Office of the Permanent Secretary',this)">📁 Office of the PS</div>${departments.map(d=>`<div class="folder child" onclick="chooseFolder('${d}',this)">📁 ${d}</div>`).join('')}<div class="folder child" onclick="chooseFolder('Completed Processes',this)">📁 Completed Processes</div></div><div class="pb"><div style="display:flex;justify-content:space-between;margin-bottom:13px"><div><b id="foldertitle">Office of the Permanent Secretary</b><div class="mini">CONTENT PAGE · Select a document to inspect its metadata and history</div></div><span class="tag">Metadata enabled</span></div><div class="docgrid" id="docgrid">${docs.map(d=>docCard(d)).join('')}</div><div id="docdetail" style="margin-top:15px"></div></div></div></div>`}
if(page==='search'){v.innerHTML=heading('Search & Process Tracking','Find a document or process by tracking ID, title, reference number, department or initiating officer.')+`<div class="panel"><div class="pb"><div class="toolbar"><input class="search" style="flex:1" id="trackq" placeholder="e.g. ECO-2026-0041, procurement, ICT Department" oninput="trackSearch()"><button class="btn" onclick="trackSearch()">Search</button></div><div id="trackresults" style="margin-top:16px">${processTable()}</div></div></div>`}
if(page==='reports'){v.innerHTML=heading('Reports & Audit','Workflow monitoring, turnaround visibility and auditable records of official action.')+`<div class="cards">${stat('Processes initiated','Current reporting period','41','＋')}${stat('Approved','Senior management decisions','29','✓')}${stat('In implementation','Awaiting departmental closure','07','↻')}${stat('Archived','Closed and preserved','05','▣')}</div><div class="grid2"><div class="panel"><div class="ph"><h3>Process register</h3><button class="btn light sm" onclick="toast('Report exported in production version')">Export report</button></div>${processTable()}</div><div class="panel"><div class="ph"><h3>Audit trail principles</h3></div><div class="pb"><div class="timeline"><div class="event"><b>Initiation</b><small>Officer, date/time, originating department and attachments.</small></div><div class="event"><b>Review and minuting</b><small>Every minute, recommendation, forward and return is time-stamped.</small></div><div class="event"><b>Approval decision</b><small>Approving authority, decision, comments and date.</small></div><div class="event"><b>Implementation and closure</b><small>Responsible officer, implementation note and closure confirmation.</small></div><div class="event"><b>Automatic archival</b><small>Completed process and its entire action history are retained together.</small></div></div></div></div></div>`}
if(page==='admin'){v.innerHTML=heading('Administration & Ministry Structure','Illustrative organisational hierarchy and workflow configuration for a Federal Ministry.')+`<div class="grid2"><div class="panel"><div class="ph"><h3>Ministry hierarchy</h3></div><div class="pb"><div class="hierarchy"><div class="level">Honourable Minister</div><div class="arrow">↕</div><div class="level">Minister of State</div><div class="arrow">↕</div><div class="level ps">Permanent Secretary · Administrative Head</div><div class="arrow">↕</div><div class="level dept">Directors · Departmental Heads</div><div class="arrow">↕</div><div class="level">Deputy Directors / Assistant Directors</div><div class="arrow">↕</div><div class="level">Chief Officers / Desk Officers / Other Officers</div></div></div></div><div class="panel"><div class="ph"><h3>Correspondence movement rules</h3></div><div class="pb"><div class="field"><label>DEPARTMENTAL MOVEMENT</label><div class="note">Junior officers forward to a more senior officer in their department. Each recipient records minutes before forwarding further.</div></div><div class="field"><label>DIRECTOR-TO-PS CONTROL</label><div class="note">Only a Director may send departmental correspondence to the Permanent Secretary.</div></div><div class="field"><label>PS CORRESPONDENCE CONTROL</label><div class="note">The Permanent Secretary may forward correspondence to the Minister, Minister of State, Directors or other appropriate officers in the Ministry hierarchy.</div></div><div class="field"><label>IMPLEMENTATION & CLOSURE</label><div class="note">Following the necessary decision or instruction, the file is sent back to the responsible Director for assignment, implementation monitoring and closure. Closure triggers archival with the complete audit trail.</div></div></div></div></div>`}
}
function docCard(d){return `<div class="doccard" onclick="selectDoc('${d.id}')"><div class="di">${d.type==='PDF'?'▤':d.type==='XLSX'?'▦':'▧'}</div><b>${d.name}</b><small>${d.id} · ${d.date}</small></div>`}
function chooseFolder(f,el){folder=f;document.querySelectorAll('.folder').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('#foldertitle').textContent=f;let a=docs.filter(d=>f==='Completed Processes'||d.folder===f||f==='Office of the Permanent Secretary');$('#docgrid').innerHTML=a.map(docCard).join('')||'<div class="muted">No documents in this folder.</div>';$('#docdetail').innerHTML=''}function filterDocs(){let q=$('#docsearch').value.toLowerCase();$('#docgrid').innerHTML=docs.filter(d=>(d.name+d.id+d.owner).toLowerCase().includes(q)).map(docCard).join('')||'<div class="empty">No matching documents.</div>'}
function selectDoc(id){let d=docs.find(x=>x.id===id);selectedDoc=d;$('#docdetail').innerHTML=`<div class="panel" style="box-shadow:none"><div class="ph"><h3>Selected document · ${d.id}</h3><button class="btn light sm" onclick="closeDoc()">Close</button></div><div class="pb"><div class="grid2"><div><b>${d.name}</b><p class="mini">Repository content preview placeholder · ${d.type}</p><div class="toolbar"><button class="btn light sm" onclick="toast('Document preview opens here in production')">Preview</button><button class="btn light sm" onclick="toast('Download initiated in production')">Download</button><button class="btn light sm" onclick="toast('Document link copied in production')">Copy reference</button></div></div><div class="meta"><div><span>Reference</span><b>${d.id}</b></div><div><span>Folder</span><b>${d.folder}</b></div><div><span>Owner</span><b>${d.owner}</b></div><div><span>Classification</span><b>${d.class}</b></div><div><span>Date filed</span><b>${d.date}</b></div><div><span>Record status</span><b>${d.status}</b></div></div></div><p class="mini">Repository layout follows the user manual's three-pane concept: folder tray, content page and metadata panel. A process record will also expose its consolidated action history.</p></div></div>`}
function closeDoc(){$('#docdetail').innerHTML='';selectedDoc=null}
function tabFilter(type,el){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));el.classList.add('active');let a=type==='all'?processes.filter(p=>p.status!=='Archived'):type==='pending'?processes.filter(p=>p.status==='With Permanent Secretary'||p.status==='In Progress'):type==='progress'?processes.filter(p=>p.status==='Implementation'):processes.filter(p=>p.status==='Archived');$('#tasklist').innerHTML=processTable(a)}
function trackSearch(){let q=$('#trackq').value.toLowerCase();let a=processes.filter(p=>(p.id+p.title+p.dept+p.initiator+p.stage).toLowerCase().includes(q));$('#trackresults').innerHTML=processTable(a)}
function nextRecipients(current){
 const map={
  'Desk Officer':['Chief Officer','Assistant Director','Deputy Director','Director'],
  'Chief Officer':['Assistant Director','Deputy Director','Director'],
  'Assistant Director':['Deputy Director','Director'],
  'Deputy Director':['Director'],
  'Director':['Permanent Secretary','Deputy Director','Assistant Director','Chief Officer','Desk Officer'],
  'Permanent Secretary':['Honourable Minister','Minister of State','Director','Deputy Director','Assistant Director','Chief Officer','Desk Officer'],
  'Minister of State':['Honourable Minister','Permanent Secretary'],
  'Honourable Minister':['Permanent Secretary','Minister of State']
 };
 return map[current]||[];
}
function submitProcess(){let type=$('#ptype').value,title=$('#ptitle').value.trim(),dept=$('#pdept').value,summary=$('#psummary').value.trim(),first=$('#pfirst').value;if(!type||!title||!summary||!first){toast('Please complete the required fields.');return}let id='ECO-2026-'+String(42+processes.length-4).padStart(4,'0');let p={id,title,dept,initiator:$('#pinit').value,stage:'With '+first,status:'In Progress',owner:first,currentLevel:first,implementationOfficer:'Desk Officer',actions:[[new Date().toLocaleString(),$('#pinit').value,'Initiated '+type+'. '+summary+' Sent to '+first+' for review and further minuting.']]};let link=$('#plink').value;if(link){let d=docs.find(x=>x.id===link);p.actions.push([new Date().toLocaleString(),'System','Linked repository record: '+d.name+' ('+d.id+').'])}processes.unshift(p);toast('Process sent to '+first+' · '+id);openProcess(id)}
function openProcess(id){let p=processes.find(x=>x.id===id);if(!p)return;let actionButtons='';let forwardOptions=nextRecipients(role);let isOwner=(p.owner===role)||(role==='Desk Officer'&&p.status==='Implementation');
 if(p.status!=='Archived'&&isOwner){
  if(role==='Director'&&p.status==='Implementation'){
   actionButtons=`<button class="btn" onclick="act('${id}','assign')">Assign for implementation</button><button class="btn light" onclick="act('${id}','close')">Close file & archive</button>`;
  } else if(p.status==='Implementation'){
   actionButtons=`<button class="btn green" onclick="act('${id}','complete')">Submit implementation completion</button>`;
  } else {
   actionButtons=`<button class="btn" onclick="act('${id}','forward')">Minute & Forward</button>`;
   if(role==='Permanent Secretary') actionButtons+=`<button class="btn green" onclick="act('${id}','decision')">Record PS decision & return</button>`;
   if(role==='Honourable Minister'||role==='Minister of State') actionButtons+=`<button class="btn green" onclick="act('${id}','decision')">Record decision & return to PS</button>`;
   actionButtons+=`<button class="btn red" onclick="act('${id}','return')">Return to previous officer</button>`;
  }
 }
 let timeline=p.actions.map(a=>`<div class="event"><b>${a[1]} · ${a[2]}</b><small>${a[0]}</small></div>`).join('');
 let recipientUI='';
 if(isOwner&&p.status!=='Archived'&&p.status!=='Implementation'&&forwardOptions.length){
  recipientUI=`<div class="field"><label>FORWARD TO / SEND TO *</label><select id="nextrecipient">${forwardOptions.map(x=>`<option>${x}</option>`).join('')}</select><div class="mini">Available recipients are controlled by your position in the Ministry hierarchy. Only a Director can send departmental correspondence to the Permanent Secretary.</div></div>`;
 }
 if(role==='Director'&&isOwner&&p.status==='Implementation'){
  recipientUI=`<div class="field"><label>ASSIGN IMPLEMENTATION TO</label><select id="implementer"><option>Desk Officer</option><option>Chief Officer</option><option>Assistant Director</option><option>Deputy Director</option></select></div>`;
 }
 $('#modtitle').textContent=p.id+' · '+p.title;
 $('#modbody').innerHTML=`<div class="toolbar" style="justify-content:space-between"><span>${status(p.status)}</span><span class="tag">${p.stage}</span></div><div class="meta" style="margin:12px 0"><div><span>Originating department</span><b>${p.dept}</b></div><div><span>Initiator</span><b>${p.initiator}</b></div><div><span>Current custodian</span><b>${p.owner}</b></div><div><span>Current stage</span><b>${p.stage}</b></div><div><span>Tracking ID</span><b>${p.id}</b></div></div><div class="note">Correspondence follows the Ministry chain of command. Junior officers send to a more senior officer in their department. Only the Director may send departmental correspondence to the Permanent Secretary. The PS may forward to other appropriate levels.</div><div class="field" style="margin-top:12px"><label>OFFICIAL MINUTE / ACTION COMMENT *</label><textarea id="minute" placeholder="Record your official minute, observations, comments or instructions before forwarding..."></textarea></div>${recipientUI}<div class="field"><label>INSERT REPOSITORY DOCUMENT INTO MESSAGE</label><select id="insertdoc"><option value="">— Select a repository document to reference —</option>${docs.map(d=>`<option value="${d.id}">${d.id} · ${d.name}</option>`).join('')}</select><div class="mini">Select an existing repository record to reference it in your minute.</div></div><div class="toolbar"><button class="btn light sm" onclick="insertReference()">＋ Insert document reference</button></div><h4 style="font-size:11px;margin:18px 0 7px">ACTION HISTORY / AUDIT TRAIL</h4><div class="timeline">${timeline}</div><div class="actions">${actionButtons}<button class="btn light" onclick="closeModal()">Close</button></div>`;
 $('#modalback').classList.add('show');
}
function insertReference(){let id=$('#insertdoc').value;if(!id){toast('Select a repository document first.');return}let d=docs.find(x=>x.id===id),t=$('#minute');t.value+=(t.value?'\n':'')+'[Repository reference: '+d.id+' — '+d.name+']';toast('Repository reference inserted into minute')}
function act(id,kind){let p=processes.find(x=>x.id===id),minute=$('#minute')?.value.trim()||'',now=new Date().toLocaleString(),who=role;if(!minute&&kind!=='close'){toast('Please enter your official minute or comment before proceeding.');return}if(p.owner!==role&&!(role==='Desk Officer'&&p.status==='Implementation')){toast('This file is not currently assigned to your role. Chain-of-command routing cannot be bypassed.');return}
 if(kind==='forward'){
  let to=$('#nextrecipient')?.value;if(!to){toast('Select the officer to receive this correspondence.');return}
  if(to==='Permanent Secretary'&&role!=='Director'){toast('Only a Director may send departmental correspondence to the Permanent Secretary.');return}
  p.actions.push([now,who,'OFFICIAL MINUTE: '+minute+' Forwarded to '+to+'.']);p.previousOwner=role;p.owner=to;p.currentLevel=to;p.stage='With '+to;p.status='In Progress';
 } else if(kind==='decision'){
  let to=role==='Permanent Secretary'?'Director':'Permanent Secretary';p.actions.push([now,who,'DECISION / INSTRUCTION: '+minute+' Returned to '+to+' for further action.']);p.previousOwner=role;p.owner=to;p.currentLevel=to;p.stage='Decision recorded; returned to '+to;p.status='In Progress';
 } else if(kind==='return'){
  p.actions.push([now,who,'RETURNED WITH MINUTE: '+minute]);p.owner=p.previousOwner||'Desk Officer';p.previousOwner=role;p.stage='Returned to '+p.owner+' for further action / clarification';p.status='Returned';
 } else if(kind==='assign'){
  let to=$('#implementer')?.value||'Desk Officer';p.actions.push([now,who,'IMPLEMENTATION INSTRUCTION: '+minute+' Assigned to '+to+' for implementation.']);p.owner=to;p.implementationOfficer=to;p.stage='Implementation assigned to '+to;p.status='Implementation';
 } else if(kind==='complete'){
  p.actions.push([now,who,'IMPLEMENTATION COMPLETED: '+minute+' Submitted to Director for review and closure.']);p.owner='Director';p.stage='Implementation completed; awaiting Director closure';p.status='Implementation';
 } else if(kind==='close'){
  p.actions.push([now,who,'FILE CLOSED: '+minute]);p.actions.push([now,'ECOsoft System','Automatically archived the original submission, attachments, metadata, all official minutes, correspondence, decisions, implementation evidence and complete action history in the Ministry Repository.']);p.stage='Archived in Ministry Repository';p.status='Archived';p.owner='Repository';docs.unshift({id:'DOC-'+id.replace('ECO-',''),name:p.title+'.pdf',folder:p.dept,type:'PDF',date:new Date().toLocaleDateString(),owner:p.dept,class:'Official',status:'Archived'});
 }
 closeModal();toast(kind==='close'?'File closed and automatically archived':'Minute recorded and correspondence forwarded successfully');render();
}
function closeModal(){$('#modalback').classList.remove('show')}$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});render();
</script></body></html>
